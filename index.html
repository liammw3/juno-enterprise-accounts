<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juno • Enterprise Account Report</title>
<style>
  :root{
    --dark:#013A2F;
    --accent:#1CE49B;
    --bg:#F0F2F5;
    --card:#ffffff;
    --border:#e8eaed;
    --critical:#dc2626;
    --high:#f97316;
    --medium:#ca8a04;
    --low:#16a34a;
    --text:#1a2b28;
    --muted:#6b7a77;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:var(--dark);
    color:#fff;
    padding:20px 32px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .logo-badge{
    width:40px;height:40px;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--dark);font-size:18px;
  }
  header h1{font-size:19px;margin:0;font-weight:650;}
  header .sub{font-size:12.5px;color:#b9d8cf;margin-top:2px;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .badge-auto{
    background:rgba(28,228,155,0.15);
    border:1px solid var(--accent);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    padding:5px 10px;
    border-radius:999px;
  }
  .main{max-width:1320px;margin:0 auto;padding:28px 32px 60px;}

  .summary-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-bottom:20px;
  }
  .metric-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .metric-card .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .metric-card .value{font-size:26px;font-weight:750;color:var(--dark);margin-top:6px;}
  .metric-card.risk .value{color:var(--critical);}

  .chart-row{
    display:grid;
    grid-template-columns:1.4fr 2fr;
    gap:16px;
    margin-bottom:24px;
  }
  .chart-card, .csm-card-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-card h3, .csm-card-wrap h3{margin:0 0 12px;font-size:14px;color:var(--dark);}
  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
  .legend .row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .legend .row span.n{font-weight:700;color:var(--dark);}

  .csm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .csm-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:all .15s ease;
    background:#fafbfc;
  }
  .csm-card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .csm-card.active{border-color:var(--dark);background:rgba(1,58,47,0.06);}
  .csm-card .name{font-weight:700;font-size:13.5px;color:var(--dark);}
  .csm-card .stats{font-size:12px;color:var(--muted);margin-top:5px;}
  .csm-card .stats b{color:var(--critical);}

  .toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  #search{
    flex:1;
    min-width:220px;
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13.5px;
    background:#fff;
  }
  #search:focus{outline:none;border-color:var(--accent);}
  .pills{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
  }
  .pill.active{background:var(--dark);color:#fff;border-color:var(--dark);}
  .pill[data-tier="Critical"].active{background:var(--critical);border-color:var(--critical);}
  .pill[data-tier="High"].active{background:var(--high);border-color:var(--high);}
  .pill[data-tier="Medium"].active{background:var(--medium);border-color:var(--medium);}
  .pill[data-tier="Low"].active{background:var(--low);border-color:var(--low);}
  .results-count{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .clear-btn{
    font-size:12px;color:var(--dark);background:none;border:1px solid var(--border);
    border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:600;
  }

  .table-wrap{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    background:var(--dark);
    color:#fff;
    text-align:left;
    padding:11px 14px;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.02em;
    cursor:pointer;
    position:sticky;top:0;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{background:#025443;}
  thead th .arrow{opacity:.6;font-size:10px;margin-left:4px;}
  tbody tr{border-bottom:1px solid var(--border);cursor:pointer;}
  tbody tr:hover{background:#f6f9f8;}
  tbody tr.at-risk{background:rgba(220,38,38,0.055);}
  tbody tr.at-risk:hover{background:rgba(220,38,38,0.1);}
  td{padding:11px 14px;vertical-align:middle;}
  td.company a{color:var(--dark);font-weight:650;text-decoration:none;}
  td.company a:hover{text-decoration:underline;color:var(--accent);}
  .tag{
    display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:650;
    background:#eef1f0;color:var(--dark);
  }
  .util-cell{display:flex;align-items:center;gap:8px;min-width:130px;}
  .util-bar-bg{flex:1;height:7px;border-radius:99px;background:#e9edec;overflow:hidden;}
  .util-bar-fill{height:100%;border-radius:99px;}
  .util-pct{font-size:12.5px;font-weight:700;width:44px;text-align:right;}
  .tier-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

  /* Detail panel */
  .overlay{
    position:fixed;inset:0;background:rgba(1,20,16,0.35);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .panel{
    position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;
    background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,0.15);
    transform:translateX(100%);transition:transform .25s ease;
    z-index:41;overflow-y:auto;
  }
  .panel.show{transform:translateX(0);}
  .panel-head{
    background:var(--dark);color:#fff;padding:20px 24px;position:relative;
  }
  .panel-head h2{margin:0 0 4px;font-size:19px;}
  .panel-head .meta{font-size:12.5px;color:#b9d8cf;}
  .panel-close{
    position:absolute;top:16px;right:18px;background:none;border:none;color:#fff;
    font-size:20px;cursor:pointer;opacity:.8;
  }
  .panel-close:hover{opacity:1;}
  .panel-body{padding:22px 24px;}
  .panel-section{margin-bottom:24px;}
  .panel-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .kv{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .kv .l{font-size:11px;color:var(--muted);}
  .kv .v{font-size:15px;font-weight:700;color:var(--dark);margin-top:2px;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;}
  .forecast-box{
    background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.5;
  }
  .forecast-box b{color:var(--dark);}
  .hs-link{
    display:inline-block;margin-top:14px;font-size:13px;font-weight:650;color:var(--accent);text-decoration:none;
  }
  .hs-link:hover{text-decoration:underline;}

  @media (max-width:1100px){
    .summary-row{grid-template-columns:repeat(2,1fr);}
    .chart-row{grid-template-columns:1fr;}
  }
</style>
</head>

// ---- derived fields ----
function tierOf(u){
  if(u>=0.80) return 'Critical';
  if(u>=0.60) return 'High';
  if(u>=0.30) return 'Medium';
  return 'Low';
}
const TIER_COLOR = {Critical:'#dc2626', High:'#f97316', Medium:'#ca8a04', Low:'#16a34a'};

function daysSince(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr+'T00:00:00Z');
  const d2 = new Date(TODAY+'T00:00:00Z');
  return Math.round((d2-d1)/86400000);
}

accounts.forEach((a,i)=>{
  a._idx = i+1;
  a._tier = tierOf(a.util);
  a._daysSince = daysSince(a.closedate);
});

// ---- state ----
let state = { search:'', tier:'All', csm:null, sortKey:'util', sortDir:'desc' };

// ---- date line ----
document.getElementById('dateLine').textContent = 'July 7, 2026 · ' + accounts.length + ' enterprise accounts';

// ---- summary cards ----
function renderSummary(){
  const totalPurchased = accounts.reduce((s,a)=>s+a.purchased,0);
  const totalUsed = accounts.reduce((s,a)=>s+a.used,0);
  const overallUtil = totalPurchased ? totalUsed/totalPurchased : 0;
  const atRisk = accounts.filter(a=>a.util>=0.80).length;

  const cards = [
    {label:'Total Accounts', value: accounts.length},
    {label:'Total Purchased', value: totalPurchased.toLocaleString()},
    {label:'Total Used', value: totalUsed.toLocaleString()},
    {label:'Overall Utilization', value: (overallUtil*100).toFixed(1)+'%'},
    {label:'At-Risk (≥80%)', value: atRisk, risk:true},
  ];
  document.getElementById('summaryRow').innerHTML = cards.map(c=>`
    <div class="metric-card ${c.risk?'risk':''}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
    </div>
  `).join('');
}

// ---- donut chart ----
function renderDonut(){
  const tiers = ['Critical','High','Medium','Low'];
  const counts = tiers.map(t=>accounts.filter(a=>a._tier===t).length);
  const total = accounts.length || 1;
  const R = 60, CX=80, CY=80, STROKE=24;
  const circumference = 2*Math.PI*R;
  let offset = 0;
  let segs = '';
  tiers.forEach((t,i)=>{
    const frac = counts[i]/total;
    const len = frac*circumference;
    segs += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${TIER_COLOR[t]}" stroke-width="${STROKE}"
      stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${CX} ${CY})"/>`;
    offset += len;
  });
  const svg = `<svg width="160" height="160" viewBox="0 0 160 160">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#eef1f0" stroke-width="${STROKE}"/>
    ${segs}
    <text x="${CX}" y="${CY-2}" text-anchor="middle" font-size="22" font-weight="750" fill="#013A2F">${total}</text>
    <text x="${CX}" y="${CY+16}" text-anchor="middle" font-size="10.5" fill="#6b7a77">accounts</text>
  </svg>`;
  const legend = `<div class="legend">${tiers.map((t,i)=>`
    <div class="row"><span><span class="dot" style="background:${TIER_COLOR[t]}"></span>${t} (≥${t==='Critical'?'80':t==='High'?'60':t==='Medium'?'30':'0'}%)</span><span class="n">${counts[i]}</span></div>
  `).join('')}</div>`;
  document.getElementById('donutWrap').innerHTML = svg + legend;
}

// ---- CSM cards ----
function renderCsmCards(){
  const byCsm = {};
  accounts.forEach(a=>{
    byCsm[a.csm] = byCsm[a.csm] || {count:0, risk:0};
    byCsm[a.csm].count++;
    if(a.util>=0.80) byCsm[a.csm].risk++;
  });
  const names = Object.keys(byCsm).sort((a,b)=>byCsm[b].count-byCsm[a].count);
  document.getElementById('csmCards').innerHTML = names.map(n=>`
    <div class="csm-card ${state.csm===n?'active':''}" data-csm="${n}">
      <div class="name">${n}</div>
      <div class="stats">${byCsm[n].count} accounts · <b>${byCsm[n].risk}</b> at-risk</div>
    </div>
  `).join('');
  document.querySelectorAll('.csm-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      const csm = el.getAttribute('data-csm');
      state.csm = (state.csm===csm) ? null : csm;
      renderAll();
    });
  });
}

// ---- filtering ----
function getFiltered(){
  let list = accounts.slice();
  if(state.csm) list = list.filter(a=>a.csm===state.csm);
  if(state.tier !== 'All') list = list.filter(a=>a._tier===state.tier);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(a=> a.name.toLowerCase().includes(q) || a.csm.toLowerCase().includes(q));
  }
  return list;
}

function sortList(list){
  const {sortKey, sortDir} = state;
  const dir = sortDir==='asc' ? 1 : -1;
  return list.slice().sort((a,b)=>{
    let va, vb;
    if(sortKey==='idx'){ va=a._idx; vb=b._idx; }
    else if(sortKey==='daysSince'){ va=a._daysSince ?? -1; vb=b._daysSince ?? -1; }
    else { va=a[sortKey]; vb=b[sortKey]; }
    if(typeof va === 'string'){ va=va.toLowerCase(); vb=vb.toLowerCase(); }
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}

// ---- table ----
function renderTable(){
  const filtered = sortList(getFiltered());
  document.getElementById('resultsCount').textContent = `${filtered.length} of ${accounts.length} accounts`;

  document.getElementById('tbody').innerHTML = filtered.map((a,i)=>{
    const barColor = TIER_COLOR[a._tier];
    const pct = (a.util*100).toFixed(1);
    return `<tr class="${a.util>=0.80?'at-risk':''}" data-name="${encodeURIComponent(a.name)}">
      <td>${i+1}</td>
      <td class="company"><a href="${a.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${a.name}</a></td>
      <td><span class="tag">${a.stage}</span></td>
      <td>${a.csm}</td>
      <td>${a.purchased.toLocaleString()}</td>
      <td>${a.used.toLocaleString()}</td>
      <td>
        <div class="util-cell">
          <div class="util-bar-bg"><div class="util-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div>
          <span class="util-pct" style="color:${barColor}">${pct}%</span>
        </div>
      </td>
      <td>${a.closedate || '—'}</td>
      <td>${a._daysSince!=null ? a._daysSince+'d' : '—'}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('#tbody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const name = decodeURIComponent(tr.getAttribute('data-name'));
      openDetail(accounts.find(a=>a.name===name));
    });
  });

  // update header sort arrows
  document.querySelectorAll('thead th').forEach(th=>{
    th.querySelector('.arrow')?.remove();
    if(th.getAttribute('data-key')===state.sortKey){
      const arrow = document.createElement('span');
      arrow.className='arrow';
      arrow.textContent = state.sortDir==='asc' ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}

// ---- detail panel ----
function openDetail(a){
  if(!a) return;
  document.getElementById('pName').textContent = a.name;
  document.getElementById('pMeta').textContent = `${a.csm} · ${a.stage}`;

  const pct = a.util*100;
  const color = TIER_COLOR[a._tier];
  const R=54, CX=70, CY=70, STROKE=14;
  const circumference = Math.PI*R; // half circle gauge
  const filled = Math.min(pct,100)/100*circumference;

  // credit forecast: burn rate = used / days since close (if close date known and used>0)
  let forecastHtml;
  if(a._daysSince && a._daysSince>0 && a.used>0 && a.util<1){
    const perDay = a.used/a._daysSince;
    const remaining = a.purchased - a.used;
    const daysToExhaust = perDay>0 ? Math.ceil(remaining/perDay) : null;
    if(daysToExhaust){
      const exhaustDate = new Date(TODAY+'T00:00:00Z');
      exhaustDate.setUTCDate(exhaustDate.getUTCDate()+daysToExhaust);
      const dateStr = exhaustDate.toISOString().slice(0,10);
      forecastHtml = `At the current burn rate of <b>${perDay.toFixed(2)} returns/day</b>, this account is projected to reach
        100% utilization around <b>${dateStr}</b> (~${daysToExhaust} days from today).`;
    } else {
      forecastHtml = `Burn rate is currently flat — not enough usage velocity to project an exhaustion date.`;
    }
  } else if(a.util>=1){
    forecastHtml = `<b>This account has already reached or exceeded its purchased return limit.</b> Recommend reaching out about an upsell or overage conversation.`;
  } else {
    forecastHtml = `Not enough usage history since close to project a reliable burn rate yet.`;
  }

  document.getElementById('panelBody').innerHTML = `
    <div class="panel-section">
      <h4>Key Metrics</h4>
      <div class="kv-grid">
        <div class="kv"><div class="l">Purchased</div><div class="v">${a.purchased.toLocaleString()}</div></div>
        <div class="kv"><div class="l">Used</div><div class="v">${a.used.toLocaleString()}</div></div>
        <div class="kv"><div class="l">Utilization</div><div class="v" style="color:${color}">${pct.toFixed(1)}%</div></div>
        <div class="kv"><div class="l">Tier</div><div class="v" style="color:${color}">${a._tier}</div></div>
        <div class="kv"><div class="l">Close Date</div><div class="v">${a.closedate || '—'}</div></div>
        <div class="kv"><div class="l">Days Since Close</div><div class="v">${a._daysSince!=null ? a._daysSince : '—'}</div></div>
      </div>
    </div>
    <div class="panel-section">
      <h4>Utilization Gauge</h4>
      <div class="gauge-wrap">
        <svg width="140" height="90" viewBox="0 0 140 80">
          <path d="M ${CX-R} ${CY} A ${R} ${R} 0 0 1 ${CX+R} ${CY}" fill="none" stroke="#eef1f0" stroke-width="${STROKE}" stroke-linecap="round"/>
          <path d="M ${CX-R} ${CY} A ${R} ${R} 0 0 1 ${CX+R} ${CY}" fill="none" stroke="${color}" stroke-width="${STROKE}" stroke-linecap="round"
            stroke-dasharray="${filled} ${circumference-filled}"/>
          <text x="${CX}" y="${CY-6}" text-anchor="middle" font-size="20" font-weight="750" fill="#013A2F">${pct.toFixed(0)}%</text>
        </svg>
      </div>
    </div>
    <div class="panel-section">
      <h4>Credit Forecast</h4>
      <div class="forecast-box">${forecastHtml}</div>
    </div>
    <a class="hs-link" href="${a.url}" target="_blank" rel="noopener">Open in HubSpot →</a>
  `;

  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
function closeDetail(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
}
document.getElementById('panelClose').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', closeDetail);

// ---- toolbar events ----
document.getElementById('search').addEventListener('input', (e)=>{
  state.search = e.target.value;
  renderTable();
});
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    state.tier = p.getAttribute('data-tier');
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    renderTable();
  });
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  state.search=''; state.tier='All'; state.csm=null;
  document.getElementById('search').value='';
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  document.querySelector('.pill[data-tier="All"]').classList.add('active');
  renderAll();
});
document.querySelectorAll('thead th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.getAttribute('data-key');
    if(state.sortKey===key){
      state.sortDir = state.sortDir==='asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'desc';
    }
    renderTable();
  });
});

function renderAll(){
  renderSummary();
  renderDonut();
  renderCsmCards();
  renderTable();
}
renderAll();
</script>
